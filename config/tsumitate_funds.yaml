# NISAの「つみたて投資枠」で積み立てる代表的な指数を、同じ物差しで比べるためのリストです。
#
# つみたて投資枠で買えるのは投資信託（ファンド）ですが、投資信託の日々の基準価額は
# 株価データの取得元（yfinance）から安定して取れません。そこで、同じ指数に連動する
# 東証上場のETF（円建て）の値動きで代用して、Gemini APIで毎日スコア付けし、
# レポート内の「NISAつみたて投資枠」セクションにスコア順で表示します。
#
# ⚠ ETFの値動きは分配金を含まないため、分配金を再投資する投資信託とは長期の騰落率が少しずれます。
# ⚠ 代表的なファンド例は登録時点の名称です。つみたて投資枠の対象かどうか・信託報酬は、
#   購入前に証券会社のサイトで確認してください。同じ指数に連動する他社のファンドもあります。
#
# 各項目の意味:
#   symbol: 値動きの代用に使うETFのティッカー
#   name: 表示名（指数の分類）
#   market: "ETF"（ベンチマーク比の計算をしない）
#   theme: 的中率をまとめて集計するためのテーマ名
#   news_query: 関連ニュースの検索語（ETFの正式名称ではニュースが見つかりにくいため）
#   tsumitate:
#     index: 連動する指数
#     proxy: 値動きの代用に使っているETFの名前
#     example_funds: つみたて投資枠の代表的なファンド例
#     nisa_frame: 買えるNISAの枠。省略時は "つみたて投資枠"。金のようにつみたて投資枠の対象外で、
#       成長投資枠でなら積み立てられるものは "成長投資枠" と書く（カードに「成長投資枠のみ」と出る）。
#
# つみたて投資枠の対象かどうかは、金融庁の「つみたて投資枠対象商品届出一覧」で確認した
# （https://www.fsa.go.jp/policy/nisa2/products/index.html 、2026-10-23版・377本）。
# 金・コモディティのファンドは1本もない。NASDAQ100・FANG+・NYダウは「指定インデックス投資信託以外」の
# 区分に一部のファンドだけが載っている（例: eMAXIS NASDAQ100インデックスは載っていない）。
# 全米株式・米国高配当も対象だが、同じ指数に連動する東証上場ETFが無いため載せていない。

funds:
  # MSCI ACWIそのものに連動する2559.T（MAXIS全世界株式）は、2026年6月の分割前後の株価データが
  # 崩れていて1年騰落率が-88%と出るため、日本を除くACWIに連動する1554.Tで代用している（日本は約5%）。
  - symbol: "1554.T"
    name: "全世界株式（オール・カントリー）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "全世界株式 オルカン"
    tsumitate:
      index: "MSCI ACWI（日本を含む先進国・新興国の約50ヶ国）"
      proxy: "上場インデックスファンド世界株式（MSCI ACWI）除く日本"
      example_funds: ["eMAXIS Slim 全世界株式（オール・カントリー）"]

  # 2558.T（MAXIS）は2559.Tと同じく分割前後のデータが崩れている。1655.Tはウォッチリストと重複するため2633.Tを使う。
  - symbol: "2633.T"
    name: "米国株式（S&P500）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "S&P500 米国株"
    tsumitate:
      index: "S&P500（米国の大型株約500社）"
      proxy: "NEXT FUNDS S&P500指数（為替ヘッジなし）連動型上場投信"
      example_funds: ["eMAXIS Slim 米国株式（S&P500）"]

  - symbol: "1657.T"
    name: "先進国株式（日本を除く）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "先進国株 MSCIコクサイ"
    tsumitate:
      index: "MSCIコクサイ（日本を除く先進国22ヶ国）"
      proxy: "iシェアーズ・コア MSCI 先進国株（除く日本）ETF"
      example_funds: ["eMAXIS Slim 先進国株式インデックス"]

  - symbol: "2520.T"
    name: "新興国株式"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "新興国株"
    tsumitate:
      index: "MSCIエマージング・マーケット（中国・インド・台湾などの新興国）"
      proxy: "NEXT FUNDS 新興国株式・MSCI-EM（為替ヘッジなし）連動型上場投信"
      example_funds: ["eMAXIS Slim 新興国株式インデックス"]

  # 1306.T・1321.Tは株価データに1日だけ1/10・1/100になる異常値が混じるため、異常値の無いETFを使う。
  - symbol: "1475.T"
    name: "日本株式（TOPIX）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "TOPIX 日本株"
    tsumitate:
      index: "TOPIX（東証の幅広い銘柄）"
      proxy: "iシェアーズ・コア TOPIX ETF"
      example_funds: ["eMAXIS Slim 国内株式（TOPIX）"]

  - symbol: "1346.T"
    name: "日本株式（日経平均）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "日経平均"
    tsumitate:
      index: "日経平均株価（東証の代表的な225銘柄）"
      proxy: "MAXIS 日経225上場投信"
      example_funds: ["eMAXIS Slim 国内株式（日経平均）"]

  # 以下4つは 2026-11-09 に追加。代用ETFは、同じ指数の中で株価データに異常値の無いものを選んだ
  # （1545.T は2026年5月、1546.T は2026年11月に値が1/100以下になる日があったため使わない）。
  - symbol: "2631.T"
    name: "米国株式（NASDAQ100）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "ナスダック100 米国ハイテク株"
    tsumitate:
      index: "NASDAQ100（米ナスダック上場の金融を除く大型株100社。IT企業の比率が高い）"
      proxy: "MAXIS ナスダック100上場投信"
      example_funds: ["iFreeNEXT NASDAQ100インデックス", "インデックスファンドNASDAQ100（アメリカ株式）"]

  - symbol: "316A.T"
    name: "米国株式（FANG+）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "FANG+ 米国テック株"
    tsumitate:
      index: "NYSE FANG+（米国の大型テック・ネット企業10社に均等に投資。銘柄数が少なく値動きが大きい）"
      proxy: "iFreeETF FANG+"
      example_funds: ["iFreeNEXT FANG+インデックス"]

  - symbol: "2241.T"
    name: "米国株式（NYダウ）"
    market: "ETF"
    theme: "つみたて投資枠"
    news_query: "NYダウ"
    tsumitate:
      index: "ダウ・ジョーンズ工業株価平均（米国を代表する30社）"
      proxy: "MAXIS NYダウ上場投信"
      example_funds: ["eMAXIS NYダウインデックス", "iFree NYダウ・インデックス", "たわらノーロード NYダウ"]

  # 三菱UFJ 純金ファンドは1540.Tそのものに投資しているため、代用のずれがほとんど無い。
  # 成長投資枠の対象であることは運用会社の販売用資料（2026年4月版）で確認した。
  - symbol: "1540.T"
    name: "金（ゴールド）"
    market: "ETF"
    theme: "金（ゴールド）"
    news_query: "金価格 ゴールド"
    tsumitate:
      index: "国内の金価格（大阪取引所の金先物をもとにした1グラムあたりの円建て価格）"
      proxy: "純金上場信託（現物国内保管型）"
      example_funds: ["三菱UFJ 純金ファンド（ファインゴールド）"]
      nisa_frame: "成長投資枠"
