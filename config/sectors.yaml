# 業種（セクター）ごとの強さを同じ物差しで比べるための、TOPIX-17業種別ETFのリストです。
#
# 東証の上場企業を17の業種に分け、それぞれの業種全体の値動きに連動するETF
# （野村アセットマネジメントの「NEXT FUNDS TOPIX-17」シリーズ）を毎日Gemini APIで分析し、
# レポート内の「業種別の強さ」セクションにスコア順で表示します。
#
# watchlist.yaml や candidate_pool.yaml は人が選んだ銘柄なので、どうしても分野が偏ります。
# このリストは全業種を1つずつ並べているので、「どの業種が強そうか」を偏りなく比べられます。
#
# ⚠ これらのETFは1日の売買量が少ないものが多く、買値と売値の差が広がりやすいです。
#   実際に売買するよりも、業種の強さを比べる物差しとして使うことを主な目的にしています。
#
# 各項目の意味:
#   symbol / market / nisa_growth_eligible: candidate_pool.yaml と同じ
#   name: 表示名（業種名）
#   sector: 業種名（AIへの入力に使う。「個別企業ではなく業種全体として判定する」よう指示する）
#   theme: 的中率を業種ごとに集計するためのテーマ名（sectorと同じにしている）
#   news_query: 関連ニュースの検索語（ETFの正式名称では業種のニュースが見つからないため）

sectors:
