    nisa_growth_eligible: true
    yutai:
      content: "QUOカード。100株以上を1年以上継続保有（3月末・9月末の株主名簿に3回以上連続）で1,000円分、5年以上（11回以上連続）で1,500円分。毎年6月の株主総会決議通知に同封"
      shares: 100
      months: [3]
      annual_value_jpy: 1000
      link: "https://yutai-guide.daiwair.co.jp/stock/detail/6904"
      source: "松井証券・大和IR 株主優待ガイド等（2026-11-02確認。金額変更の記述もあるため会社IRで要確認）"
