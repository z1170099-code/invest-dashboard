# 「株主優待がもらえて、少ない金額で買えて、株価の上昇も期待できるか」を見るための
# 株主優待銘柄のリストです。
#
# ここに登録した銘柄は毎日Gemini APIで分析され、レポート内の「株主優待銘柄」セクションに
# 買い/売りスコア付きで表示されます。優待の内容もAIに渡し、権利確定月の前後の値動き
# （権利付き最終日に向けて買われ、権利落ち日に下がりやすい等）も判断材料にさせます。
#
# ⚠ 株主優待は原則「単元株（ほとんどの銘柄で100株）」以上を株主名簿に載った状態で
#   持っている人が対象です。単元未満株（1株単位や金額指定の買い方）では、ほぼすべての銘柄で
#   優待はもらえません。
# ⚠ 優待は会社の判断で変更・廃止されることがあります。checked_on の日付時点で
#   Webで確認した内容なので、購入前に必ず各社のIRサイトで最新の内容を確認してください。
#
# 各項目の意味:
#   max_min_investment_jpy: 「安く買える」とみなす最低投資金額（株価×必要株数）の上限（円）。
#     これを超える銘柄もレポートには表示されますが、「予算オーバー」と表示されます。
#   symbol / name / market / theme / nisa_growth_eligible: candidate_pool.yaml と同じ
#   yutai:
#     content: 優待の内容（AIへの入力とレポート表示に使う）
#     shares: 優待をもらうのに必要な株数
#     months: 権利確定月（その月の末日時点の株主が対象）
#     annual_value_jpy: （任意）必要株数で1年間にもらえる優待の金額の目安（円）。
#       入力すると「優待利回り」（優待の金額÷最低投資金額）を計算して表示します。
#       金額に換算しにくい優待（割引・無料プラン等）や、毎年はもらえない優待は空欄（null）。

max_min_investment_jpy: 150000
checked_on: "2026-10-25"

