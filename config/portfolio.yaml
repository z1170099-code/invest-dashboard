# ここには「実際に自分が購入した銘柄」を登録してください。
# watchlist.yaml（気になる銘柄）や candidate_pool.yaml（ハイリスク候補）とは違い、
# ここに登録した銘柄は「もう買った後、いつ売るか」をAIが判断する専用リストです。
#
# 各項目の意味:
#   symbol: ティッカーコード（watchlist.yamlと同じ表記）
#   name: 表示名
#   market: "JP" / "US" / "ETF" など（自由記述）
#   purchase_date: 購入日（"YYYY-MM-DD"形式）
#   purchase_price: 購入時の価格（1株あたり。円や米ドルなど、銘柄の通貨単位で入力）
#   theme: （任意）テーマ名の自由記述。candidate_pool.yamlと表記を揃えておくと、
#     レポートの「テーマ別配分」で集計しやすくなります。未入力の場合は「未分類」として扱われます。
#   account: （任意）購入した証券会社の口座。レポートでは口座ごとに別の枠で表示されます。
#     未入力の場合は "PayPay証券" として扱います。
#   account_type: （任意）"NISA" / "特定口座" / "一般口座"。未入力の場合は "NISA" として扱います。
#     NISA以外の銘柄は、レポートの「NISA成長投資枠の使用状況」の集計に含めません。
#   amount_invested_jpy: （任意）その購入で実際に投資した円換算金額。単元未満株で
#     「◯円分購入」のように買った場合は、その円金額をそのまま入力してください。
#     入力しておくと、レポートに保有銘柄のテーマ別配分（何%がどのテーマに偏っているか）が
#     表示されます。未入力の銘柄はテーマ別配分の集計から除外されます。
#
# 投資信託（yfinanceに株価が無いもの）は、次の2つを書きます。
#   nav_csv: 運用会社が公開している基準価額のCSVのURL（1列目が基準日、2列目が基準価額）
#   units: 保有口数。基準価額は1万口あたりなので、purchase_price も1万口あたりの取得単価で書く
#   symbol には協会コード（8桁、Yahoo!ファイナンスなどに出ている番号）を書く
#
# sell_once: （任意）条件を満たした最初の日に1回だけ「売却の合図」を出す（scripts/sell_once.py）。
#   deadline: この日までに売りたいという期限。最後の14日間は、含み益が条件以上なら合図を出す
#   min_gain_pct: 合図を出す最低の含み益（%、既定3）。含み損のときは合図を出さない
#   一度出した合図は data/sell_signals.json に記録され、取り消されない
#
# 同じ銘柄を複数回に分けて買った場合（ナンピン等）は、購入ごとに別の項目として
# 登録してください（symbolが重複してもOKです）。
#
# 例（実際に使う際はコメントを外して自分の情報に書き換えてください）:
# holdings:
#   - symbol: "7203.T"
#     name: "トヨタ自動車"
#     market: "JP"
#     purchase_date: "2026-04-10"
#     purchase_price: 2950
#     theme: "自動車"
#     amount_invested_jpy: 5000

holdings:
  - symbol: "NVDA"
    name: "NVIDIA"
    market: "US"
    purchase_date: "2026-07-16"
    purchase_price: 206.92  # 単元未満株を7,000円分購入。当日終値をUSD換算の取得単価として使用
