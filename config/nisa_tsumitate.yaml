# NISAの「つみたて投資枠」の積立設定を登録するファイルです。
# まだ積立を始めていない場合は、下の tsumitate: [] のままで構いません
# （その場合でも、レポートには「年内に枠を使い切るなら月いくら積み立てればよいか」の
# 目安が0円からの計算として表示されます）。
#
# 積立を始めたら、以下の形式で追記してください。
#
# 各項目の意味:
#   start_date: 積立を開始した日（"YYYY-MM-DD"形式）。この月から集計対象になります。
#   end_date: （任意）積立額を変更・停止した場合の最終日。省略時は現在も継続中として扱います。
#   monthly_amount_jpy: 月々の積立額（円）
#   fund_name: （任意）表示用のファンド名。集計には使いません。
#
# 積立額を月の途中で変更した場合は、それまでの行に end_date を追加したうえで、
# 新しい金額の行を別に追加してください。
#
# 例（実際に使う際はコメントを外して自分の情報に書き換えてください）:
# tsumitate:
#   - start_date: "2026-10-01"
#     monthly_amount_jpy: 30000
#     fund_name: "eMAXIS Slim 全世界株式(オール・カントリー)"
#   - start_date: "2027-04-01"
#     monthly_amount_jpy: 50000
#     fund_name: "eMAXIS Slim 全世界株式(オール・カントリー)"

tsumitate: []
