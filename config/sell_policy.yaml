# 保有銘柄の売却判断に、一時的な自分の方針を反映させるための設定ファイルです。
#
# profit_taking_until: この日付までは「利確優先モード」になります（"YYYY-MM-DD"形式）。
#   - 含み益が出ている銘柄は、今後の値下がりが見込まれる材料が少しでもあれば
#     AIが「売却検討」と判定するようになります
#   - 含み損の銘柄は通常どおり判断します（期限までに含み益に転じる見込みも考慮）
#   - 期限を過ぎると自動的に通常の判断に戻ります
#   - モードをやめたい場合は、この行を削除するか過去の日付にしてください
# profit_taking_accounts: 利確優先モードを適用する口座（portfolio.yaml の account）。
#   書かなければ全口座の保有銘柄に適用されます。
#
# 2027年1月からNISA口座をPayPay証券から楽天証券に変更するにあたり、
# 年内に含み益の銘柄を利益確定しておきたいという方針で設定しています。
# 楽天証券で新しく買った銘柄はこの方針の対象外なので、PayPay証券の口座だけに適用しています。

profit_taking_until: "2026-12-31"
profit_taking_accounts: ["PayPay証券"]
