name: Daily Investment Report

on:
  schedule:
    # 朝9:30の更新は cron-job.org から起動している（README参照）。こちらは予備の夕方便で、
    # UTC 08:30 = JST 17:30。Gemini無料枠の1日の上限は米国太平洋時間0時（JST 16時、冬時間は17時）に
    # リセットされるため、朝の便が上限切れで失敗しても、リセット後のこの便で取り戻せるようにしている。
    - cron: "30 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
          PYTHONUTF8: "1"
        run: python main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          git diff --cached --quiet || git commit -m "Update report $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 実行中に設定ファイル等の変更がpushされていても、その上に積み直してから保存する
          git pull --rebase origin main
          git push
