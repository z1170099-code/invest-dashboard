name: Daily Investment Report

on:
  schedule:
    # 朝9:30の更新は cron-job.org から起動している（README参照）。こちらは予備の夕方便で、
    # UTC 08:30 = JST 17:30。2026-11-02から上位モデル（1日の回数上限が厳しい）を使うため更新は1日1回にし、
    # この便は「最後の更新から20時間以上たっているとき」（cron-job.orgが動かなかった日など）だけ実行する。
    # GitHubの混雑で8時間ほど遅れて日付が変わってから動くことがあるため、日付ではなく経過時間で判定する。
    - cron: "30 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    # 通常は30分前後で終わる。AIの応答待ちには1回4分の上限があるので、3時間あれば十分。
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 下の「最後の更新からの経過時間」の判定で、レポートを最後に更新したコミットを探せるように履歴も取る
          fetch-depth: 50

      - name: Skip if updated within 20 hours (scheduled backup run only)
        id: guard
        run: |
          last=$(git log -1 --format=%ct -- docs/index.html)
          now=$(date +%s)
          hours=$(( (now - ${last:-0}) / 3600 ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hours" -lt 20 ]; then
            echo "最後の更新から${hours}時間しかたっていないため、予備便はスキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate report
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
          PYTHONUTF8: "1"
        run: python main.py

      - name: Commit and push if changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          git diff --cached --quiet || git commit -m "Update report $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 実行中に設定ファイル等の変更がpushされていても、その上に積み直してから保存する
          git pull --rebase origin main
          git push
